name: Build OpenJDK Binding

on:
  workflow_call:
    inputs:
      debug-level:
        required: true
        type: string
      build-env-var:
        required: false
        type: string
      # The binding repo and ref to build. When empty, use the repo and commit that triggered the workflow.
      # They need to be set when this workflow is called from another repo (e.g. mmtk-core).
      binding-repo:
        required: false
        type: string
        default: ''
      binding-ref:
        required: false
        type: string
        default: ''
      # The mmtk-core repo and ref to build with. When both are empty, use the mmtk-core version in mmtk/Cargo.toml.
      # When only the ref is given, the repo defaults to mmtk/mmtk-core.
      mmtk-core-repo:
        required: false
        type: string
        default: ''
      mmtk-core-ref:
        required: false
        type: string
        default: ''
      # Prefix of the uploaded artifact names. A caller that runs the tests more than once in a workflow run
      # (e.g. mmtk-core testing multiple OpenJDK versions) needs a different prefix for each.
      artifact-prefix:
        required: false
        type: string
        default: ''

jobs:
  build:
    name: linux-${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Platforms to build for. `arch` is the architecture in OpenJDK build configuration names.
        platform:
          - { arch: x86_64, runner: ubuntu-22.04 }
          - { arch: aarch64, runner: ubuntu-22.04-arm }
    env:
      # This overrides OPENJDK_PATH in ci-common.sh
      # Note: We cannot use default environment variables (GITHUB_*) in the "env" context.  Use github.* instead.
      # See: https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/store-information-in-variables#default-environment-variables
      OPENJDK_PATH: ${{ github.workspace }}/git/openjdk
      OPENJDK_ARCH: ${{ matrix.platform.arch }}
    steps:
    - name: Checkout MMTk OpenJDK binding
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.binding-repo || github.repository }}
        ref: ${{ inputs.binding-ref || github.sha }}
        path: ./git/mmtk-openjdk
    - name: Checkout MMTk core
      if: ${{ inputs.mmtk-core-repo != '' || inputs.mmtk-core-ref != '' }}
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.mmtk-core-repo || 'mmtk/mmtk-core' }}
        ref: ${{ inputs.mmtk-core-ref }}
        path: ./git/mmtk-core
    - name: Setup boot JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
    - name: Checkout OpenJDK
      run: ./git/mmtk-openjdk/.github/scripts/ci-checkout.sh
    - name: Use the checked out mmtk-core
      if: ${{ inputs.mmtk-core-repo != '' || inputs.mmtk-core-ref != '' }}
      run: |
        pip3 install tomlkit
        python3 .github/scripts/patch-mmtk-dep.py mmtk/Cargo.toml --path ${{ github.workspace }}/git/mmtk-core
        cat mmtk/Cargo.toml
        # mmtk-core may require a newer Rust toolchain than the binding. Use the toolchain of mmtk-core.
        cp ${{ github.workspace }}/git/mmtk-core/rust-toolchain mmtk/rust-toolchain
        cat mmtk/rust-toolchain
      working-directory: ./git/mmtk-openjdk
    - name: Setup environment
      run: ./.github/scripts/ci-setup.sh
      working-directory: ./git/mmtk-openjdk
    - name: Export build environemnt variables
      if: ${{ inputs.build-env-var != '' }}
      run: |
        echo "${{ inputs.build-env-var }}" >> $GITHUB_ENV
    - name: Export build suffix
      run: |
        if [ -z "${{ inputs.build-env-var }}" ]; then
          echo "BUILD_SUFFIX=normal" >> $GITHUB_ENV
        else
          escaped_build=$(echo "${{ inputs.build-env-var }}" | sed 's/ /_/g')
          echo "BUILD_SUFFIX=$escaped_build" >> $GITHUB_ENV
        fi
    - name: Build MMTk OpenJDK ${{ inputs.debug-level }}
      env:
        DEBUG_LEVEL: ${{ inputs.debug-level }}
        OPENJDK_BUILD_TARGET: product-bundles
      run: ./.github/scripts/ci-build.sh
      working-directory: ./git/mmtk-openjdk
    - name: Upload bundles
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-prefix }}linux-${{ matrix.platform.arch }}-server-${{ inputs.debug-level }}-bundles-${{ env.BUILD_SUFFIX }}
        path: |
          ./git/openjdk/build/linux-${{ matrix.platform.arch }}-server-${{ inputs.debug-level }}/bundles/*_bin.tar.gz
          ./git/openjdk/build/linux-${{ matrix.platform.arch }}-server-${{ inputs.debug-level }}/bundles/*_bin-debug.tar.gz
        retention-days: 2
