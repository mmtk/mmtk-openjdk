name: DaCapo Tests

on:
  pull_request:
    branches:
      - jdk-21

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # The test suite is defined in binding-tests.yml, so it can be reused by mmtk-core.
  binding-tests:
    uses: ./.github/workflows/binding-tests.yml
