# Expected results of DaCapo Chopin tests on linux-aarch64 (see normal-heap.yml in this directory).
# The initial values were copied from linux-x86_64.
# results.<debug level>.<benchmark>.<plan> is one of:
# - pass: the run must pass.
# - fail: the run must fail.
# - ignore: the result is not checked.
# - {flaky: {include: <patterns>}}: the run should pass, but may fail with a known failure. If it fails,
#   the log of the run must match at least one of the patterns (a Python regular expression, or a list of them).
#   Otherwise, the failure is reported as an error.

# Patterns of known failures, referred to in `results` by YAML aliases (e.g. *oom).
known-failures:
  # The heap is too small. MarkSweep may fail this way due to its high memory usage.
  # https://github.com/mmtk/mmtk-openjdk/issues/247
  oom: &oom 'Aborting due to java\.lang\.OutOfMemoryError'
  # pmd has a data race that occasionally changes its report. It is not an MMTk bug.
  # https://github.com/mmtk/mmtk-openjdk/issues/262
  pmd-digest: &pmd-digest 'Digest validation failed for pmd-report\.txt'
  # Cassandra queries time out when GC is slow, e.g. full heap GCs in a fastdebug build.
  cassandra-timeout: &cassandra-timeout 'Cassandra timeout during|OperationTimedOutException'
  # https://github.com/mmtk/mmtk-openjdk/issues/248
  kafka-server-error: &kafka-server-error 'kafka\.common\.errors\.UnknownServerException'
  # https://github.com/mmtk/mmtk-openjdk/issues/374, https://github.com/mmtk/mmtk-openjdk/issues/379
  sunflow-image-check: &sunflow-image-check 'Image check failed!'
  # https://github.com/mmtk/mmtk-openjdk/issues/376
  lxr-tomcat: &lxr-tomcat 'ERROR Invalid 0x[0-9a-f]+ rc=0|mmtk_get_object_size\(void\*\)\+0x|returned status 500 \(expected 200\)'
  # StickyImmix may exhaust the address space during nursery GC. https://github.com/mmtk/mmtk-core/issues/1590
  sticky-immix-headroom: &sticky-immix-headroom 'A non-mutator thread failed to get pages from page resource'

