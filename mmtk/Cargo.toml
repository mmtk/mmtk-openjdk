[package]
name = "mmtk_openjdk"
version = "0.32.0"
authors = [" <>"]
rust-version = "1.84.0"
build = "build.rs"
edition = "2021"

[lib]
name = "mmtk_openjdk"
# be careful - LTO is only allowed for certain crate types
crate-type = ["cdylib"]

[profile.dev]
panic = "abort"

[profile.release]
lto = true

# Metadata for the OpenJDK repository
[package.metadata.openjdk]
# Our CI matches the following line and extract mmtk/openjdk. If this line is updated, please check ci yaml files and make sure it works.
openjdk_repo = "https://github.com/mmtk/openjdk.git"
openjdk_version = "b557520f04b35d2a7a040d43f02efc1c4911ebb7"

[dependencies]
libc = "0.2"
lazy_static = "1.1"
log = { version = "0.4", features = ["max_level_trace"] }
once_cell = "1.10.0"
atomic = "0.6.0"
memoffset = "0.9.0"
cfg-if = "1.0"
probe = "0.5"

# Be very careful to commit any changes to the following mmtk dependency, as our CI scripts (including mmtk-core CI)
# rely on matching these lines to modify them: e.g. comment out the git dependency and use the local path.
# These changes are safe:
# - change branch
# - change repo name
# But other changes including adding/removing whitespaces in commented lines may break the CI.
mmtk = { git = "https://github.com/wenyuzhao/mmtk-core.git", rev = "cb2f31c591d6555eb8606a8275e54de05762285e" }
# Uncomment the following to build locally
# mmtk = { path = "../../mmtk-core" }

[build-dependencies]
# Pinned below 0.8.1: that release requires edition2024, which needs a newer
# cargo than our MSRV (1.84.0) provides.
built = { version = ">=0.8.0, <0.8.1", features = ["git2"] }
# `built`'s git2 feature pulls in git2 -> url -> idna -> idna_adapter. idna_adapter
# 1.2.2 requires edition2024, so pin it below that too (this crate isn't used
# directly, but declaring a version bound here still constrains resolution).
idna_adapter = ">=1.2.0, <1.2.2"
# idna_adapter pulls in the icu_* crate family, which released 2.3.0 (edition2024,
# rust-version 1.88) in lockstep on 2026-08-13. Pin the whole group below that.
icu_normalizer = ">=2.2.0, <2.3.0"
icu_properties = ">=2.2.0, <2.3.0"
icu_provider = ">=2.2.0, <2.3.0"
icu_locale_core = ">=2.2.0, <2.3.0"
icu_collections = ">=2.2.0, <2.3.0"
# jobserver 0.1.35 (pulled in transitively via `cc`) requires getrandom 0.4 on the
# Windows target, and getrandom's whole 0.4.x line is edition2024. Cargo.lock
# includes Windows-only deps too, so pin jobserver back to avoid it.
jobserver = ">=0.1.30, <0.1.35"
# getrandom 0.3.x depends on wit-bindgen (via wasip2) for the wasm32-wasip2 target,
# which is also resolved into Cargo.lock even though we don't target wasm. wasip2
# >=1.0.2 requires wit-bindgen 0.57.1, which is edition2024. Pin wasip2 back to the
# last release that resolves to an edition2021 wit-bindgen.
wasip2 = ">=1.0.0, <1.0.2"

[features]
default = []
mmtk_extreme_assertions = ["mmtk/extreme_assertions"]
nogc_lock_free = ["mmtk/nogc_lock_free"]
nogc_no_zeroing = ["mmtk/nogc_no_zeroing"]
# Use the env var MMTK_VO_BIT=1 when building OpenJDK so the fastpath for setting the alloc bit will be compiled in.
# See README.
vo_bit = ["mmtk/vo_bit"]

# Place the mark bit in the header of objects instead of on the side.
mark_bit_in_header = []

# Place the forwarding bits on the side instead of in the header of objects.
forwarding_bits_on_side = []

# Use malloc mark sweep - we should only run marksweep with this feature turned on.
malloc_mark_sweep = ["mmtk/malloc_mark_sweep"]

# We can select plan at runtime. So no need to use any of these features.
# However, if any of these is provided during build-time, we will ignore any runtime flag and
# always run this plan. Performance-wise there is no difference. The main reason for these features
# is to temporarily allow running performance tests without changing performance scripts.
nogc = []
semispace = []
gencopy = []
marksweep = []
pageprotect = []
immix = []
genimmix = []
stickyimmix = []
lisp2 = []
jfr = []
